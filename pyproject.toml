[project]
name = "ssp"
version = "0.6.0"
description = "Compare and merge search-string revisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.3.1",
    "python-sat>=1.9.dev21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/string_parser"]

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLC0415"]
